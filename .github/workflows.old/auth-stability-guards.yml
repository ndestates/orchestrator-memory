name: Auth Stability Guards

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - fix/**
      - feature/**

permissions:
  contents: read

concurrency:
  group: auth-stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run auth stability static guards
        run: bash scripts/guard-auth-stability.sh

  frontend-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify Vite manifest exists
        run: test -f public/build/manifest.json

      - name: Verify required manifest entries
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/build/manifest.json','utf8')); const required=['resources/js/app.js','resources/css/app.css']; const missing=required.filter(k=>!Object.prototype.hasOwnProperty.call(m,k)); if(missing.length){console.error('Missing manifest entries:', missing.join(', ')); process.exit(1);} console.log('Manifest entries OK');"
