name: Repository Sync & Maintenance

on:
  workflow_dispatch: # Allow manual triggering
  schedule:
    # Run daily at 9 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  push:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: repo-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-branches:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0 # Fetch all history and branches

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Fetch all branches
      run: |
        git fetch --all --prune
        echo "📊 Repository Status:"
        git status --short --branch
        echo ""
        echo "🌿 All branches:"
        git branch -r | head -20

    - name: Check for outdated branches
      run: |
        mkdir -p reports/github
        {
          echo "# Remote Branch Divergence Report"
          echo
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo
          printf "| Branch | Ahead of master | Behind master | Last Commit (UTC) |\n"
          printf "|---|---:|---:|---|\n"

          while read -r branch; do
            [[ "$branch" == "HEAD" ]] && continue
            ahead=$(git rev-list --count "origin/master..origin/$branch" 2>/dev/null || echo "0")
            behind=$(git rev-list --count "origin/$branch..origin/master" 2>/dev/null || echo "0")
            last_commit=$(git log -1 --format=%cI "origin/$branch" 2>/dev/null || echo "unknown")
            printf "| %s | %s | %s | %s |\n" "$branch" "$ahead" "$behind" "$last_commit"
          done < <(git branch -r | sed 's#^[ *]*origin/##' | grep -v '^$' | sort)
        } > reports/github/branch-divergence.md

        echo "Generated reports/github/branch-divergence.md"

    - name: Detect stale remote branches (90+ days)
      run: |
        mkdir -p reports/github
        stale_count=0
        now_epoch=$(date +%s)

        {
          echo "# Stale Remote Branches"
          echo
          echo "Branches with no commits in more than 90 days (excluding master/main)."
          echo
          printf "| Branch | Days Since Last Commit | Last Commit (UTC) |\n"
          printf "|---|---:|---|\n"

          while read -r branch; do
            [[ "$branch" == "HEAD" || "$branch" == "master" || "$branch" == "main" ]] && continue

            last_ts=$(git log -1 --format=%ct "origin/$branch" 2>/dev/null || echo "0")
            [[ "$last_ts" == "0" ]] && continue

            age_days=$(( (now_epoch - last_ts) / 86400 ))
            if [[ "$age_days" -gt 90 ]]; then
              stale_count=$(( stale_count + 1 ))
              last_commit=$(git log -1 --format=%cI "origin/$branch")
              printf "| %s | %s | %s |\n" "$branch" "$age_days" "$last_commit"
            fi
          done < <(git branch -r | sed 's#^[ *]*origin/##' | grep -v '^$' | sort)
        } > reports/github/stale-branches.md

        echo "stale_count=$stale_count" >> "$GITHUB_OUTPUT"
        echo "Generated reports/github/stale-branches.md"

    - name: Upload branch maintenance artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: branch-maintenance-reports
        path: reports/github/
        if-no-files-found: error

    - name: Publish branch summary
      run: |
        {
          echo "## Repository Branch Maintenance"
          echo
          echo "- Divergence report: reports/github/branch-divergence.md"
          echo "- Stale branch report: reports/github/stale-branches.md"
        } >> "$GITHUB_STEP_SUMMARY"

  version-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check version consistency
      run: |
        if [ -f VERSION ]; then
          VERSION=$(cat VERSION)
          echo "📦 Current version: $VERSION"

          # Check if version is in composer.json
          if grep -q "\"version\": \"$VERSION\"" composer.json; then
            echo "✅ Version matches composer.json"
          else
            echo "⚠️  Version mismatch with composer.json"
          fi

          # Check if there are any tags for this version
          if git tag | grep -q "^v$VERSION$"; then
            echo "✅ Git tag exists for version $VERSION"
          else
            echo "ℹ️  No git tag found for version $VERSION"
          fi
        else
          echo "❌ VERSION file not found"
        fi

  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup PHP
      uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
      with:
        php-version: '8.3'
        tools: composer:v2
        coverage: none

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        composer install --no-interaction --prefer-dist --no-progress --no-scripts
        npm ci

    - name: Check for security vulnerabilities
      run: bash scripts/ci_security_checklist.sh

    - name: Enforce vulnerability thresholds
      run: |
        python3 scripts/security/evaluate_audit_thresholds.py \
          --composer reports/security/composer-audit-latest.json \
          --npm reports/security/npm-audit-latest.json \
          --pip reports/security/pip-audit-target-latest.json \
          --max-composer 25 \
          --max-npm-high 5 \
          --max-npm-critical 0 \
          --max-pip 2

    - name: Upload dependency audit artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dependency-audit-reports
        path: reports/security/
        if-no-files-found: warn

  notify-developers:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && failure()
    needs: [sync-branches, version-check, dependency-check]

    steps:
    - name: Notify on issues
      run: |
        {
          echo "## Scheduled Maintenance Detected Failures"
          echo
          echo "At least one maintenance job failed. Review workflow logs and uploaded artifacts."
        } >> "$GITHUB_STEP_SUMMARY"
