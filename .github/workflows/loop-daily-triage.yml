name: Loop Daily Triage (L1 host)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: loop-daily-triage-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Loop readiness audit
        run: bash scripts/loop-audit.sh

      - name: Write host snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/loop-daily-triage-host.sh

      - name: Upload triage artifact
        uses: actions/upload-artifact@v7  # Node 24 native
        with:
          name: loop-triage-${{ github.run_id }}
          path: reports/loops/
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## Loop Daily Triage (L1 host)"
            echo
            echo "- Cache is king: agent run uses \`/loop-triage\` + cache files (not this job alone)."
            echo "- Host snapshot written under \`reports/loops/\`"
            echo "- Next: run \`/loop-verifier\` on the merged triage report"
          } >> "$GITHUB_STEP_SUMMARY"