name: Template Decontamination

# Hard gate for forked project repos: fails the build if template identifiers or
# unresolved placeholders survive in the AI surfaces (.grok/.github/.claude/.copilot).
# In the orchestrator template source repo the scan self-detects and exits 0, so
# this workflow is a safe no-op here and only enforces once deployed to a fork.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches:
      - develop
      - master
    paths:
      - '.grok/**'
      - '.github/**'
      - '.claude/**'
      - '.copilot/**'
      - 'scripts/scan-template-contamination.sh'
      - '.github/workflows/template-decontamination.yml'
  push:
    branches:
      - develop
      - 'feature/**'
    paths:
      - '.grok/**'
      - '.github/**'
      - '.claude/**'
      - '.copilot/**'
      - 'scripts/scan-template-contamination.sh'
      - '.github/workflows/template-decontamination.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-decontamination-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decontamination:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan for template contamination (hard gate)
        run: bash scripts/scan-template-contamination.sh
