name: Branch Promotion PRs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - develop
      - 'feature/**'
  workflow_dispatch:
    inputs:
      source:
        description: Source branch for promotion PR
        required: false
        type: string
      target:
        description: Target branch for promotion PR
        required: false
        type: string
      draft:
        description: Create promotion PR as draft
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promotion-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-promotion-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve source and target
        id: resolve
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            source="${{ github.event.inputs.source }}"
            target="${{ github.event.inputs.target }}"

            if [[ -z "$target" && "$source" == feature/* ]]; then
              target="develop"
            fi
          else
            source="${GITHUB_REF_NAME}"

            if [[ "$source" == "develop" ]]; then
              target="master"
            elif [[ "$source" == feature/* ]]; then
              target="develop"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "reason=unsupported-source-branch" >> "$GITHUB_OUTPUT"
              echo "Skipping promotion for unsupported source branch: ${source}"
              exit 0
            fi
          fi

          if [[ -z "$source" || -z "$target" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-source-or-target" >> "$GITHUB_OUTPUT"
            echo "Skipping promotion: source and target must both be set."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Validate branch existence
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          source="${{ steps.resolve.outputs.source }}"
          target="${{ steps.resolve.outputs.target }}"

          gh api "repos/$repo/branches/$source" >/dev/null
          gh api "repos/$repo/branches/$target" >/dev/null

      - name: Check for existing open PR
        id: existing
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          source="${{ steps.resolve.outputs.source }}"
          target="${{ steps.resolve.outputs.target }}"

          existing_url="$(bash scripts/branch-promotion-pr.sh find-existing "$repo" "$owner" "$source" "$target")"
          if [[ -n "$existing_url" ]]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "url=$existing_url" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check branch diff
        id: diff
        if: steps.resolve.outputs.skip != 'true' && steps.existing.outputs.existing == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          source="${{ steps.resolve.outputs.source }}"
          target="${{ steps.resolve.outputs.target }}"

          ahead_by=$(gh api "repos/$repo/compare/$target...$source" --jq '.ahead_by')
          echo "ahead_by=$ahead_by" >> "$GITHUB_OUTPUT"

      - name: Create promotion PR
        id: create
        if: >-
          steps.resolve.outputs.skip != 'true'
          && steps.existing.outputs.existing == 'false'
          && steps.diff.outputs.ahead_by != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          source="${{ steps.resolve.outputs.source }}"
          target="${{ steps.resolve.outputs.target }}"
          draft_flag=""

          if [[ "${{ github.event.inputs.draft }}" == "true" || "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            draft_flag="--draft"
          fi

          url="$(bash scripts/branch-promotion-pr.sh create "$repo" "$owner" "$source" "$target" $draft_flag)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Promotion summary
        if: always()
        run: |
          set -euo pipefail

          {
            echo "## Branch Promotion PR"
            echo

            if [[ "${{ steps.resolve.outputs.skip }}" == "true" ]]; then
              echo "- Result: skipped (${{ steps.resolve.outputs.reason }})"
              exit 0
            fi

            echo "- Source: ${{ steps.resolve.outputs.source }}"
            echo "- Target: ${{ steps.resolve.outputs.target }}"

            if [[ "${{ steps.existing.outputs.existing }}" == "true" ]]; then
              echo "- Result: existing PR reused"
              echo "- URL: ${{ steps.existing.outputs.url }}"
            elif [[ "${{ steps.diff.outputs.ahead_by }}" == "0" ]]; then
              echo "- Result: no-op (no commits to promote)"
            elif [[ -n "${{ steps.create.outputs.url }}" ]]; then
              echo "- Result: promotion PR created or reused"
              echo "- URL: ${{ steps.create.outputs.url }}"
            else
              echo "- Result: completed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"