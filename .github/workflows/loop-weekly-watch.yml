name: Loop Weekly Watch (L1 host)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch:
    inputs:
      watch:
        description: Which watch to run (all, cache-freshness, chain-health, github-ci, repo-health)
        required: false
        default: all
        type: choice
        options:
          - all
          - cache-freshness
          - chain-health
          - github-ci
          - repo-health

permissions:
  contents: read
  actions: read

concurrency:
  group: loop-weekly-watch-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cache-freshness:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.watch == 'all' ||
      github.event.inputs.watch == 'cache-freshness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache freshness host snapshot
        run: bash scripts/loop-cache-freshness-host.sh
      - uses: actions/upload-artifact@v7
        with:
          name: loop-cache-freshness-${{ github.run_id }}
          path: reports/loops/*-cache-freshness-host.md
          if-no-files-found: error

  chain-health:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.watch == 'all' ||
      github.event.inputs.watch == 'chain-health'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install pyyaml
      - name: Chain health host snapshot
        run: bash scripts/loop-chain-health-host.sh
      - uses: actions/upload-artifact@v7
        with:
          name: loop-chain-health-${{ github.run_id }}
          path: reports/loops/*-chain-health-host.md
          if-no-files-found: error

  github-ci:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.watch == 'all' ||
      github.event.inputs.watch == 'github-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: GitHub CI host snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/loop-github-ci-host.sh
      - uses: actions/upload-artifact@v7
        with:
          name: loop-github-ci-${{ github.run_id }}
          path: reports/loops/*-github-ci-host.md
          if-no-files-found: error

  repo-health:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.watch == 'all' ||
      github.event.inputs.watch == 'repo-health'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repo health host snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/loop-repo-health-host.sh
      - uses: actions/upload-artifact@v7
        with:
          name: loop-repo-health-${{ github.run_id }}
          path: reports/loops/*-repo-health-host.md
          if-no-files-found: error