name: Security report
description: Report a potential vulnerability privately
title: "security: "
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        Do not include exploit details in a public issue.
        Use private vulnerability reporting when available.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: High-level summary without sensitive exploit details.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Potential Impact
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected Areas
      description: Files, routes, panels, or workflows that may be affected.
