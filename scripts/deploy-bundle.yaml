# Files and trees deployed from orchestrator template to target projects.
# Used by scripts/deploy_grok_to_project.py

version: 2

source_label: ndestates/orchestrator

# Default when --selections is omitted
default_selections:
  - grok
  - chains
  - loops
  - scripts

# Named selections — pass --selections grok,claude,copilot or --selections all
selections:
  grok:
    description: Grok skills, prompts, agents, and registry
    directories:
      - .grok/skills
      - .grok/prompts
      - .grok/agents
      - .grok/references
    files:
      - .grok/memories/INDEX.md
      - .grok/memories/README.md

  chains:
    description: Root chain registry (split template + compose) and CHAIN.md
    files:
      - CHAIN.md
      - chains/registry.template.yaml
      - chains/registry.yaml
    # registry.app.yaml is app-owned — never deploy from template (see never_deploy)

  loops:
    description: Loop engineering spine (LOOP.md, patterns, budget)
    directories:
      - patterns
    files:
      - LOOP.md
      - loop-budget.md

  cache-spine:
    description: >-
      Lean docs/codebase spine (README, SECTIONS, CONCERNS, freshness) + cache-efficiency
      scripts. Use with grok on wave apps; full cache via /chain cache-rebuild on demand.
    remap_files:
      - source: docs/codebase/README.md
        dest: docs/codebase/README.md
      - source: docs/codebase/SECTIONS.md
        dest: docs/codebase/SECTIONS.md
      - source: docs/codebase/CONCERNS.md
        dest: docs/codebase/CONCERNS.md
      - source: docs/codebase/.codebase-freshness.txt
        dest: docs/codebase/.codebase-freshness.txt
    files:
      - scripts/generate-cache-sections.py
      - scripts/cache_efficiency_lint.py
      - scripts/reconcile-cache-caps.py

  # Opt-in LLM Wiki (Karpathy) — scaffold + skill; not in default_selections
  wiki:
    description: >
      Karpathy-style LLM wiki: skill + schema, session/lint scripts, optional seed
      wiki/raw trees. Target apps enable wiki_policy.mode lean after deploy. Never fleet-default.
    directories:
      - .grok/skills/llm-wiki
    files:
      - .grok/prompts/llm-wiki.md
      - wiki/index.md
      - wiki/log.md
      - wiki/contradictions.md
      - wiki/open-questions.md
      - raw/README.md
      - scripts/session-wiki-brief.py
      - scripts/wiki_lint_check.py
      - scripts/loop-wiki-lint-host.sh
      - patterns/wiki-lint-watch.md
    # App-owned content under wiki/sources etc. is not force-overwritten when customized

  loops-starter:
    description: >-
      Minimal loop automation delta for wave apps — chain host prep, completion
      audit, compound learning spine, and run-chain dispatch workflow. Use without
      full chains registry when app already has LOOP.md and loop-weekly-watch.yml.
    directories:
      - .grok/skills/loop-compound
      - .grok/skills/app-compound-gate
      - starters/loop-state
    files:
      - VISION.md
      - patterns/compound-learning.md
      - patterns/app-compound-gate.md
      - reports/loops/lessons-state.json
      - scripts/run-chain-host.sh
      - scripts/chain-completion-write.sh
      - scripts/loop-repo-health-host.sh
      - scripts/loop-compound.sh
      - scripts/loop_compound.py
      - scripts/skill_health.py
      - scripts/app_compound_gate.py
      - scripts/_engine/app_compound.py
      - scripts/scaffold-loop-state.sh
      - .github/workflows/run-chain.yml

  scripts:
    description: Per-app sync, audit, and installer tooling
    directories:
      - scripts/stack-profiles
      - scripts/_engine
      - .githooks
    files:
      - scripts/sync_grok_to_github_claude.py
      - scripts/check_name_alignment.py
      - scripts/chain-audit.sh
      - scripts/loop-audit.sh
      - scripts/deploy_grok_to_project.py
      - scripts/deploy-bundle.yaml
      - scripts/orchestrator-app-update.sh
      - scripts/detect-project-runtime.sh
      - scripts/check-project-manifest.py
      - scripts/session-context-envelope.py
      - scripts/_engine/manifest_identity.py
      - scripts/_engine/mcp_runtime_policy.py
      - scripts/_engine/session_envelope.py
      - scripts/_engine/platform_surface.py
      - scripts/loop-daily-triage-host.sh
      - scripts/loop-cache-freshness-host.sh
      - scripts/loop-chain-health-host.sh
      - scripts/loop-github-ci-host.sh
      - scripts/loop-repo-health-host.sh
      - scripts/run-chain-host.sh
      - scripts/chain-completion-write.sh
      - scripts/mcp-threat-scan.sh
      - scripts/mcp-ddev-stdio.sh
      - scripts/verify_github_actions_node24.py
      - scripts/upgrade_github_actions_node24.py
      - scripts/register-project-skills.py
      - scripts/compose-registry.py
      - scripts/split-registry.py
      - scripts/migrate-app-registry-split.py
      - scripts/_engine/registry_compose.py
      - scripts/detect-project-skills.py
      - scripts/customize-skills-for-project.py
      - scripts/rename-skills-project.py
      - scripts/scan-template-contamination.sh
      - scripts/resume-branch.sh
