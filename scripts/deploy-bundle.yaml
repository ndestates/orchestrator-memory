      - scripts/check-version-alignment.py
      - scripts/orchestrator-branch-sync.py
      - scripts/detect-ollama.sh
      - scripts/install-ollama.sh
      - scripts/install-ollama-ddev.sh
      - scripts/install-ollama-compose.sh
      - scripts/install-ollama.ps1
      - scripts/ollama_detect.py
      - scripts/_engine/ollama_detect.py
      - scripts/ollama/docker-compose.ollama.yaml
      - scripts/ollama/ddev-compose.ollama-gpu.yaml.example
      - scripts/sync-all-projects.sh
      # Vault brain (session-start lessons + branch pointer + EOD emit)
      - scripts/session-vault-brief.py
      - scripts/session-wiki-brief.py
      - scripts/wiki_lint_check.py
      - scripts/loop-wiki-lint-host.sh
      - scripts/session-orchestrator-check.py
      - scripts/vault-emit-ci-failure.py
      - scripts/session-vault-todo-query.py
      - scripts/session-end-checkpoint.py
      - scripts/session-resume-brief.py
      - scripts/memory_agent.py
      - scripts/session-memory-brief.py
      - docs/guides/always-on-memory.md
      - scripts/model-route/catalog.yaml
      - scripts/patch-agent-guardrails.py
      - scripts/_engine/untrusted_text.py
      - scripts/orchestrator-template-version
      - scripts/skill_health.py
      - scripts/vault-workspace-pointer.py
      - scripts/eod-vault-emit.py
      - scripts/vault-learning-watch.py
      - scripts/backfill-vault-from-reports.py
      - reports/vault/.gitkeep
      - reports/sessions/workstreams.example.yaml
      - scripts/backfill-allowed-tools.py
      - scripts/reconcile-cache-caps.py
      - scripts/generate-cache-sections.py
      - scripts/cache_efficiency_lint.py
      - scripts/mcp-host-stdio.sh
      - scripts/git-push-secrets-guard.py
      - scripts/setup-git-hooks.sh
      - scripts/ensure-git-secrets-hooks.sh
      - scripts/patch_ci_push_secrets_guard.py
      - .gitguardian.yaml
      # Multi-workstream session v2 runtime (slash /multi-workstream → these CLIs)
      - scripts/workstream.py
      - scripts/workstream_worktree.py
      - scripts/workstream_guard.py
      - scripts/workstream_prompts.py
      - scripts/workstream_recommend.py
      - scripts/workstream_graph_example.py
      - scripts/sync-multi-workstream-surfaces.py

  mcp:
    description: Enterprise MCP server + multi-platform client examples (Grok/Cursor/Claude/Copilot/Gemini/ChatGPT)
    directories:
      - mcp-server
    files:
      - reports/mcp/.gitkeep
      - .cursor/mcp.json
      - .grok/config.toml
      - .claude/mcp.claude.example.json
      - .gemini/mcp.gemini.example.json
      - .chatgpt/mcp.chatgpt.example.json
      - .chatgpt/mcp.chatgpt.ddev.example.json
      - scripts/ensure-mcp-host.sh
      - scripts/mcp-host-stdio.sh
      - scripts/mcp-ddev-stdio.sh
      - scripts/mcp-smoke.sh

  claude:
    description: Claude Code commands and agents (run sync on source first)
    directories:
      - .claude/commands
      - .claude/agents
    files:
      - CLAUDE.md
      - .claude/README.md
      - .claude/mcp.claude.example.json

  copilot:
    description: GitHub Copilot skills mirror (.copilot/skills)
    directories:
      - .copilot/skills
    files:
      - mcp-server/config/mcp.copilot.vscode.example.json

  github:
    description: GitHub Copilot agents, prompts, and skills (.github/)
    directories:
      - .github/skills
      - .github/agents
      - .github/prompts
    files:
      - .github/copilot-instructions.md
      - .github/skills/README.md
      - .github/prompts/README.md
      - .github/AGENTS.md

  gemini:
    description: Gemini Gems, instructions, prompts and agents (tool use + best practices rollout)
    directories:
      - .gemini

  chatgpt:
    description: ChatGPT / OpenAI Codex surface (instructions, prompts, MCP examples)
    directories:
      - .chatgpt

  cursor:
    description: Cursor slash commands (run register-all-slash-commands on source first)
    directories:
      - .cursor/commands


selection_overrides:
  cache-spine:
    allow_deploy_prefixes:
      - docs/codebase/

# Per-app deploy only: orchestrator init|upgrade (fleet wave tooling permanently removed).
# Split registry (Option B): deploy registry.template.yaml only; app overlay stays on target.
# compose-registry.py merges template + registry.app.yaml -> registry.yaml after deploy.
# register-project-skills.py writes tier:app rows to registry.app.yaml. Never blind-copy
# chains/registry.yaml or registry.app.yaml.

# Never auto-copy (project-local state)
never_deploy:
  - chains/registry.app.yaml
  - STATE.md
  - loop-run-log.md
  - TODO
  - docs/codebase
  # Manifests: HARD project-owned — deploy never overwrites (also enforced in
  # is_never_deploy via is_protected_manifest_rel). New apps get a stack-aware
  # seed/amend from manifest_bootstrap.ensure_project_manifest after profile resolve.
  - .github/project-manifest.yaml
  - .claude/project-manifest.yaml
  - .grok/project-manifest.yaml
  - .gemini/project-manifest.yaml
  - .copilot/project-manifest.yaml
  - .cursor/project-manifest.yaml
  - .chatgpt/project-manifest.yaml
  - .grok/deploy-state.json
  - .grok/deploy-reports
  - .grok/deploy-backups
  - .copilot/memories

# Operator-only factory files (no customer app slugs in this list).
# Per-app specializations/CI profiles are also skipped in is_orchestrator_only().
orchestrator_only:
  - scripts/stack-profiles/manifest-map.yaml
  - scripts/backfill-vault-from-reports.py
  - scripts/security/flywheel-peers.yaml
  - scripts/scan-release-app-residue.py
  - scripts/_engine/public_pack.py
  - scripts/materialize-public-product.py
  - .grok/skills/github-ci-readiness-expert/references/wave-projects-ci.md

# Scaffold only when missing (never conflict-prompt)
scaffold_if_missing:
  - reports/loops/.gitkeep
  - reports/chains/.gitkeep
  - reports/tokens/.gitkeep
  - reports/bugs/.gitkeep
  - reports/bugs/backups/.gitkeep
  - reports/research/.gitkeep
  - reports/sessions/.gitkeep
  - reports/examples/agent-graphs/.gitkeep