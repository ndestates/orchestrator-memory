# Root project config for the orchestrator template + installable CLI.
# Single source of truth for the template version is /VERSION (see [tool.hatch.version]).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
description = "Open-source host CLI for manifest-first AI orchestration + always-on project memory"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
]
keywords = ["orchestrator", "ai", "agents", "memory", "vscode"]
dynamic = ["version"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.scripts]
orchestrator = "orchestrator_cli.__main__:main"

[tool.hatch.version]
path = "VERSION"
# Core X.Y.Z for wheels (PEP 440). Full pre-release identity stays in VERSION file
# (e.g. 1.9.0-pre.2) for template stamp / orchestrator version / envelope.
pattern = "^(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_cli"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

# Template trees are staged by hatch_build.py (filtered). Do not force-include
# whole scripts/ or skill dirs — that ships factory-only app specializations.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Factory checkout is private. sdist is the filtered package only (hook stages
# src/orchestrator_cli/template/ before the sdist walk).
# ignore-vcs: staged template is gitignored (never committed).
ignore-vcs = true
only-include = [
  "src/orchestrator_cli",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
  "VERSION",
  "hatch_build.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
