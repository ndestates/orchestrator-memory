    invoke: load-project-cache-first
    skill_args: When resume_context.resume_first=yes use max_cache_files from check
      (0 or 1 if cache caveat); skip TODO/STATE/VISION spine reads. Otherwise MCP-first;
      max 2 cache files; grep SECTIONS.md; .codebase-freshness.txt only — never .codebase-scan.txt
    required: true
    handoff: cache_loaded
  - id: wiki-brief
