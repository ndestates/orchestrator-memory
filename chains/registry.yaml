chains:
- id: ai-maturity
  name: AI Engineering Maturity
  description: Cache load → 8-stage maturity assessment
  intents:
  - ai maturity
  - engineering maturity
  - adoption stage
  - ai engineering
  - maturity assessment
  token_tier: low
  max_steps: 2
  cache_files_required:
  - docs/codebase/README.md
  - CHAIN.md
  - LOOP.md
  max_cache_files: 2
  steps:
  - id: load
    type: prompt
    invoke: load-project-cache-first
    required: true
    handoff: cache_loaded
  - id: assess
    type: skill
    invoke: ai-engineering-maturity
    required: true
    handoff: maturity_report
- id: always-on-memory
  name: Always-On Memory
  description: 'Ingest/consolidate/query persistent memory using full model-route
    catalog

    and project agent roster (Google always-on pattern).

    '
  intents:
  - always-on memory
  - always-on-memory
  - memory agent
  - memory query
  - consolidate memories
  - memory ingest
  token_tier: low
  max_steps: 6
  cache_files_required:
  - docs/guides/always-on-memory.md
  - TODO/
  - STATE.md
  max_cache_files: 2
  steps:
  - id: status
    type: skill
    invoke: always-on-memory
    skill_args: 'python3 scripts/memory_agent.py status; python3 scripts/memory_agent.py
      models | head;

      python3 scripts/memory_agent.py agents | head — cite catalog totals and agent
      count.

      '
    required: true
    handoff: memory_status
  - id: seed
    type: skill
    invoke: always-on-memory
    skill_args: 'If store empty or user wants truth snapshot: python3 scripts/memory_agent.py
      seed-situation.

      '
    required: false
    handoff: seeded
  - id: action
    type: skill
    invoke: always-on-memory
    skill_args: 'Run user verb: ingest|query|consolidate|serve. Default query "what
      is open next?".

      Use full model catalog picks; route agents via memory_agents.

      '
    required: true
    handoff: memory_result
  - id: brief
    type: skill
    invoke: always-on-memory
    skill_args: python3 scripts/session-memory-brief.py — print situation + picks.
    required: false
    handoff: memory_brief
- id: beta-ready
  name: Beta Ready Checklist
  description: Cache load → beta checklist → drift gate
  intents:
  - beta ready
  - beta checklist
  - ready for beta
  - pre-beta
  - launch readiness
  token_tier: medium
  max_steps: 3
  cache_files_required:
  - docs/codebase/README.md
  - docs/codebase/CONCERNS.md
  - STATE.md
  max_cache_files: 3
  steps:
  - id: load
    type: prompt
    invoke: load-project-cache-first
    required: true
    handoff: cache_loaded
  - id: checklist
    type: prompt
    invoke: beta-ready-checklist
    required: true
    handoff: checklist_result
  - id: drift
    type: skill
    invoke: project-drift-guardian
    required: true
    handoff: drift_ok
- id: bug-hunt
  name: Bug Hunt
  description: Cache load → bug scan (report-only). For fixes use bug-hunt-fix or
    pass "fix" in args
  default_mode: scan
  intents:
  - find bugs
  - hunt bugs
  - bug hunt
  - what could break
  - code review bugs
  - weakness scan
  - defect hunt
  token_tier: medium
  max_steps: 2
  cache_files_required:
  - docs/codebase/CONCERNS.md
  - docs/codebase/CONVENTIONS.md
  - docs/codebase/TESTING.md
  - TODO/
  max_cache_files: 3
  steps:
  - id: load
    type: prompt
    invoke: load-project-cache-first
    required: true
    handoff: cache_loaded
  - id: hunt
    type: skill
    invoke: bug-hunter-agent
    skill_args: scan
    required: true
    handoff: bug_report
- id: bug-hunt-deep
  name: Bug Hunt Deep
  description: Bug hunt (report) → security → schema → test safety → test gaps. Fix
    variant bug-hunt-fix-deep
  default_mode: deep
  intents:
  - deep bug hunt
  - comprehensive bug review
  - full defect scan
  - bugs and security
  - hunt all issues
  token_tier: high
  max_steps: 6
  cache_files_required:
  - docs/codebase/CONCERNS.md
  - docs/codebase/CONVENTIONS.md
  - docs/codebase/TESTING.md
  - docs/codebase/ARCHITECTURE.md
  - TODO/
  max_cache_files: 4
  steps:
  - id: load
    type: prompt
    invoke: load-project-cache-first
    required: true
    handoff: cache_loaded
  - id: hunt
    type: skill
    invoke: bug-hunter-agent
    skill_args: deep
    required: true
    handoff: bug_report
  - id: security
    type: skill
    invoke: security-audit-agent
    required: true
    handoff: security_findings
  - id: schema
    type: skill
    invoke: schema-audit-agent
    required: false
    when: database_project
    handoff: schema_findings
  - id: safety
    type: skill
    invoke: test-safety-agent
    required: false
    when: tests_requested
    handoff: test_db_ok
  - id: tests
    type: skill
    invoke: test-specialist-agent
    required: false
    when: test_gaps_found
    handoff: test_plan
- id: bug-hunt-fix
  name: Bug Hunt and Fix
  description: Cache load → hunt → apply safe fixes → test safety → verify tests
  default_mode: fix
  intents:
  - fix bugs
  - bug hunt fix
  - hunt and fix
  - repair bugs
  - patch defects
  - fix issues found
  token_tier: high
  max_steps: 4
  cache_files_required:
  - docs/codebase/CONCERNS.md
  - docs/codebase/CONVENTIONS.md
  - docs/codebase/TESTING.md
  - TODO/
  max_cache_files: 4
  fix_policy:
    auto_fix: low,medium
    suggest_only: critical,high
    require_approval_for: auth,payment,crypto,permissions
    rollback:
      required: true
      script: .grok/skills/bug-hunter-agent/scripts/bug-hunt-backup.py
      backup_dir: reports/bugs/backups
      exempt: critical_security
  steps:
  - id: load
    type: prompt
    invoke: load-project-cache-first
    required: true
    handoff: cache_loaded
  - id: hunt
    type: skill
    invoke: bug-hunter-agent
    skill_args: fix
    required: true
    handoff: bug_report
  - id: safety
    type: skill
    invoke: test-safety-agent
    required: true
    when: fixes_applied
    handoff: test_db_ok
  - id: tests
    type: skill
    invoke: test-specialist-agent
    required: false
    when: fixes_applied
    handoff: test_plan
- id: bug-hunt-fix-deep
  name: Bug Hunt Fix Deep
  description: Deep hunt with fixes → security suggest → test safety → tests for regressions
  default_mode: fix
  intents:
  - deep fix bugs
  - fix all bugs
  - comprehensive fix
  - hunt fix and test
  token_tier: high
  max_steps: 6
  cache_files_required:
  - docs/codebase/CONCERNS.md
  - docs/codebase/CONVENTIONS.md
  - docs/codebase/TESTING.md
  - docs/codebase/ARCHITECTURE.md
  - TODO/
  max_cache_files: 4
  fix_policy:
    auto_fix: low,medium
    suggest_only: critical,high
    require_approval_for: auth,payment,crypto,permissions
    rollback:
