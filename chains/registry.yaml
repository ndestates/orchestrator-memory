    skill_args: 'REQUIRED FIRST — python3 scripts/session-context-envelope.py --write
      (auto-switches to remote_last when clean via resume-branch --apply). ALWAYS
      run session-resume-brief.py check --json and print card when present (even if
      stale). When resume_first=yes: lean path (card authoritative). When no: full
      session-start but still surface check+card. Dirty tree blocks switch — commit/stash
      first. Cite docs/reference/session-context-token-budget.md.

      '
    required: true
