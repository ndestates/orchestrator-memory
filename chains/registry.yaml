    invoke: cyber-security-essentials
    skill_args: 'LEAN session standard — bash scripts/session-security-sweep.sh (default:
      **this app only** — secrets guard + CSE; does NOT scan ~/projects; opt-in fleet
      with --all-repos); writes reports/security/session-sweep-YYYY-MM-DD.md; MUST
      cite report_path + overall=PASS|WARN|FAIL and findings summary in the user briefing
      (security sweep report is mandatory); CSE is gap-only/static not full certification;
      offer /chain cyber-essentials-review when cse_warns>0; report-only — no auto-fix;
      skip deep source reads

      '
    required: true
    handoff: security_status
