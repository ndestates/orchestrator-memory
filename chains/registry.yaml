    invoke: session-context-envelope
    skill_args: 'Mint fixed-size context: python3 scripts/session-context-envelope.py
      --write. Default applies remote_last switch. Print compact + always surface
      check/card ask. ALWAYS surface orch kind/offer (automatic upgrade check — offer
      only, never auto-apply). expand on red, blocked_dirty, or orch_upgrade. All
      platforms: .grok .claude .copilot .gemini .cursor.

      '
    required: true
    handoff: session_envelope
  - id: standup
    type: skill
    invoke: daily-standup-with-cache
    skill_args: 'Honor session_envelope — do NOT re-run detect/identity/vault dumps
      if envelope present. Always surface check+card from resume. When resume_first=yes:
      envelope is the briefing. When resume_first=no: full depth if needed. Auto-switch
      already done by envelope (remote_last when clean). MCP get_project_manifest
      only when mcp=yes; session-wiki-brief index-only; Do NOT sync-all-projects.sh;
      warn when local_llm_ready=no

      '
    required: true
    handoff: priorities
